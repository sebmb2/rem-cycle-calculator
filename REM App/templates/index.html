<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REM Cycle Calculator</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">
  <div class="container py-5">
    <h1 class="mb-4">REM Cycle Calculator</h1>
    <form method="post" class="row g-3 mb-4">
      <div class="col-md-4">
        <label class="form-label">Mode</label>
        <select name="mode" class="form-select" required>
          <option value="wake">Bed → Wake Times</option>
          <option value="bed">Wake → Bed Times</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Time (24‑hr HH:MM)</label>
        <input name="time" type="time" class="form-control" required>
      </div>
      <div class="col-md-4 align-self-end">
        <button type="submit" class="btn btn-primary w-100">
          Calculate
        </button>
      </div>
    </form>

    {% if result %}
      <h4>{{ title }}</h4>
      <ul class="list-group">
        {% for cycles, t in result %}
          <li class="list-group-item">
            {{ cycles }} cycle{{ 's' if cycles>1 else '' }} → {{ t }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
</body>
</html>
